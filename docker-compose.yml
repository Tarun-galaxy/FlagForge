version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: feature_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: feature_flags
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: feature_redis
    restart: always
    ports:
      - "6379:6379"

  libretranslate:
    image: libretranslate/libretranslate
    container_name: feature_libretranslate
    restart: always
    environment:
      LT_LOAD_ONLY: "en,es,fr,de,hi,zh,ja,ar,pt,ru"
    ports:
      - "5000:5000"


volumes:
  postgres_data: